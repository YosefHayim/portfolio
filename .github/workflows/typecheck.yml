name: Typecheck

# Single-purpose, reusable (workflow_call): tsc --noEmit / tsc -b across living
# TypeScript packages (server, clientV3, clientV4). Frozen v1/v2 are built in
# the build workflow, not typechecked here.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup packages
        uses: ./.github/actions/setupPackages
        with:
          packages: server clientV3 clientV4

      - name: Type check server + clientV3 + clientV4
        run: pnpm typecheck
