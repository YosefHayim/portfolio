name: Client checks
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  typecheck:
    uses: ./.github/workflows/typecheck.yml
  test:
    uses: ./.github/workflows/test.yml
  build:
    uses: ./.github/workflows/build.yml
  browser:
    uses: ./.github/workflows/browser.yml
  gate:
    name: CI Gate
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs:
    - lint
    - typecheck
    - test
    - build
    - browser
    if: always()
    steps:
    - name: Require every check to pass
      run: test "${{ needs.lint.result }}" = "success" && test "${{ needs.typecheck.result }}" = "success" && test "${{ needs.test.result
        }}" = "success" && test "${{ needs.build.result }}" = "success" && test "${{ needs.browser.result }}" = "success"
