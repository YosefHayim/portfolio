name: E2E

# Placeholder only — portfolio has no Playwright/Cypress (or similar) e2e suite.
# This workflow is NOT wired into ci.yml so the merge gate stays truthful.
#
# When a real suite lands:
#   1. Add a root `test:e2e` script that runs real browser tests
#   2. Uncomment the Playwright install step
#   3. Wire `e2e:` into ci.yml `needs` + the gate success checks
#
# Calling this workflow without a suite fails loudly (no fake green).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E tests
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require a real e2e suite
        run: |
          if ! grep -q '"test:e2e"' package.json; then
            echo "::error::No root test:e2e script. Portfolio has no e2e suite yet."
            echo "Keep this workflow out of ci.yml until a real suite exists (honest skip — no fake green)."
            exit 1
          fi

      - name: Setup packages
        uses: ./.github/actions/setupPackages
        with:
          packages: clientV3 server

      # Playwright: install the browser before the suite (uncomment with a real suite).
      # - name: Install Playwright browsers
      #   run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
