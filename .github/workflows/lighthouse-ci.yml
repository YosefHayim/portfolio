# Lab gate — Lighthouse against clientV4 static dist on every PR / main push.
name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            clientV4/pnpm-lock.yaml
            shared/pnpm-lock.yaml

      - name: Install shared + clientV4
        run: |
          set -euo pipefail
          (cd shared && HUSKY=0 pnpm install --frozen-lockfile)
          (cd clientV4 && HUSKY=0 pnpm install --frozen-lockfile)

      - name: Build clientV4
        run: pnpm --dir clientV4 build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
