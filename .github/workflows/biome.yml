name: Biome

# Single-purpose, reusable (workflow_call): lint + format check for living
# packages (server + clientV3). Biome does both, so there is no separate
# lint/format workflow. clientV1/clientV2 are frozen snapshots (Biome-exempt).
# clientV4 has no biome config yet.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  biome:
    name: Lint & format (biome check)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup packages
        uses: ./.github/actions/setupPackages
        with:
          packages: server clientV3

      - name: Lint server + clientV3
        run: pnpm lint
