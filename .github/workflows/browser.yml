name: CI Gate
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  browser:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - run: pnpm --dir client exec playwright install --with-deps --only-shell chromium webkit
      - run: pnpm build && pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: client/test-results
          retention-days: 7
