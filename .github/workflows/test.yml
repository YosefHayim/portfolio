name: Test

# Single-purpose, reusable (workflow_call): real unit/integration tests.
# Today that is server vitest (`pnpm --dir server test`). clientV3 declares a
# test script pointing at a missing file — root `pnpm test` does not call it.
# No e2e suite lives here (see e2e.yml).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ubuntu / node 22
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup packages
        uses: ./.github/actions/setupPackages
        with:
          packages: server

      - name: Run server tests
        run: pnpm test
