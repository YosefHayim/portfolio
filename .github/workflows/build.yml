name: Build

# Single-purpose, reusable (workflow_call): build the unified site dist/ the
# Worker serves (clientV3 at /, nested v1/v2/v4 via scripts/buildAll.sh) and
# compile the Express API (server tsc).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ubuntu / node 22
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup packages
        uses: ./.github/actions/setupPackages
        with:
          # buildAll.sh re-installs era packages; server needs an explicit install.
          packages: server clientV1 clientV2 clientV3 clientV4

      - name: Build sites (dist/) + server
        run: pnpm build
